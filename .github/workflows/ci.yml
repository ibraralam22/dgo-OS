name: DGO Backend CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      # Local Postgres instance for integration/migration tests
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dgo_crm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # Local Redis instance for cache testing
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: './backend/package-lock.json'

    - name: Install NPM Dependencies
      run: |
        cd backend
        npm ci

    - name: Run ESLint Verification
      run: |
        cd backend
        npm run lint

    - name: Validate Prisma Schema
      run: |
        cd backend
        npx prisma validate

    - name: Generate Prisma Client
      run: |
        cd backend
        npx prisma generate
      env:
        DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/dgo_crm_test?schema=public"

    - name: Run Test Coverage
      run: |
        cd backend
        npm run test
      env:
        DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/dgo_crm_test?schema=public"
        REDIS_URL: "redis://localhost:6379/0"
        JWT_SECRET: "ci_testing_access_token_secret_key"
        JWT_EXPIRES_IN: "15m"
        JWT_REFRESH_SECRET: "ci_testing_refresh_token_secret_key"
        JWT_REFRESH_EXPIRES_IN: "7d"
        SWAGGER_PATH: "api/docs"

    - name: Compile Production Build
      run: |
        cd backend
        npm run build
